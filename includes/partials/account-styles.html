    <!-- Shared styles of the account pages (sign up, log in, /account…). They sit on the site's
         orange page background, the teams-linked-page shell of the Teams and Stats pages, with the
         same white breadcrumb and the home-unified-theme fonts and buttons. Include it in a page's
         head section with the partials.account-styles include. (Never write the directive itself in
         this comment: view.php expands directives inside comments too, so the partial would include
         itself for ever.) -->
    <style>
        .acct-page .team-breadcrumb .breadcrumb-item,
        .acct-page .team-breadcrumb .breadcrumb-item + .breadcrumb-item::before { color: rgba(255, 255, 255, 0.78); }
        .acct-page .team-breadcrumb .breadcrumb-item a { color: rgba(255, 255, 255, 0.95); }
        .acct-page .team-breadcrumb .breadcrumb-item a:hover { color: #fff; }
        .acct-page .team-breadcrumb .breadcrumb-item.active { color: #fff; }
        .acct-card {
            max-width: 560px; margin: 8px auto 0; background: #fff; border: 1px solid rgba(11, 80, 167, 0.14);
            border-radius: 20px; box-shadow: 0 18px 40px rgba(2, 6, 23, 0.18); padding: 32px;
            font-family: var(--font-family-Font-2, Roboto), sans-serif; color: #0f172a;
        }
        .acct-card--wide { max-width: 820px; }
        .acct-card + .acct-card { margin-top: 20px; }
        .acct-card h1, .acct-card h2 { color: #0b50a7; font-family: "Bebas Neue", sans-serif; font-weight: 400; letter-spacing: 0.02em; margin: 0 0 8px; }
        .acct-card h1 { font-size: clamp(2.2rem, 4vw, 2.75rem); line-height: 1; }
        .acct-card h2 { font-size: 1.6rem; line-height: 1.1; }
        .acct-card > p, .acct-hint { color: #475569; line-height: 1.6; }
        .acct-hint { font-size: 0.85rem; margin: 6px 0 0; }
        .acct-card label { color: #0f172a; font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .acct-card .form-control, .acct-card .form-select { font-family: inherit; border: 1px solid rgba(11, 80, 167, 0.22); border-radius: 10px; padding: 11px 14px; color: #0f172a; }
        .acct-card .form-control:focus, .acct-card .form-select:focus { border-color: #0b50a7; box-shadow: 0 0 0 0.2rem rgba(11, 80, 167, 0.16); }
        .acct-card .form-control.is-invalid, .acct-card .form-select.is-invalid { border-color: #dc3545; }
        .acct-card .form-check-label { font-weight: 400; }
        .acct-card .form-check-input:checked { background-color: #0b50a7; border-color: #0b50a7; }
        .acct-trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .acct-submit, .acct-secondary {
            display: inline-block; border-radius: 10px; padding: 12px 26px; font-family: var(--font-family-Font-2, Roboto), sans-serif;
            font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; text-align: center; text-decoration: none; cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .acct-submit { margin-top: 6px; background: #0b50a7; color: #fff; border: 1px solid #0b50a7; }
        .acct-submit:hover, .acct-submit:focus { background: #083b7d; border-color: #083b7d; color: #fff; }
        .acct-submit--block { display: block; width: 100%; }
        .acct-secondary { background: #fff; color: #0b50a7; border: 1px solid #0b50a7; padding: 11px 22px; }
        .acct-secondary:hover, .acct-secondary:focus { background: #0b50a7; color: #fff; }
        .acct-links { margin: 18px 0 0; color: #475569; text-align: center; }
        .acct-links a, .acct-card .form-check-label a { color: #0b50a7; font-weight: 700; }
        .acct-flash { max-width: 820px; margin: 0 auto 16px; }
        @media (max-width: 640px) { .acct-card { padding: 24px 18px; border-radius: 16px; } }
    </style>
