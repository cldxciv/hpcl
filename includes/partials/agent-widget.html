<!-- Pro HPCL membership sales agent widget. Posts to /agent/chat (includes/agent.php). -->
<div id="hpcl-agent" data-base="{{BASE}}" data-endpoint="{{BASE}}/agent/chat">
    <button type="button" class="hpcl-agent__bubble" aria-label="Chat with the Pro HPCL membership assistant" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="26" height="26"><path fill="currentColor" d="M12 3C6.98 3 3 6.58 3 11c0 2.4 1.17 4.55 3.02 6.02L5 21l4.28-2.14c.86.22 1.78.34 2.72.34 5.02 0 9-3.58 9-8s-3.98-8-9-8Z"/></svg>
        <span class="hpcl-agent__bubble-label">Membership help</span>
    </button>

    <section class="hpcl-agent__panel" role="dialog" aria-label="Pro HPCL membership assistant" hidden>
        <header class="hpcl-agent__head">
            <div>
                <p class="hpcl-agent__title">Pro HPCL Assistant</p>
                <p class="hpcl-agent__subtitle">Membership &amp; business promotion</p>
            </div>
            <button type="button" class="hpcl-agent__close" aria-label="Close chat">&times;</button>
        </header>
        <div class="hpcl-agent__log" aria-live="polite"></div>
        <form class="hpcl-agent__form">
            <input class="hpcl-agent__input" type="text" name="message" autocomplete="off" maxlength="1500"
                placeholder="Ask about membership plans…" aria-label="Your message">
            <button class="hpcl-agent__send" type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path fill="currentColor" d="M3 11l18-8-8 18-2-7-8-3Z"/></svg>
            </button>
        </form>
    </section>
</div>

<style>
    #hpcl-agent { position: fixed; right: 20px; bottom: 20px; z-index: 1080; font-family: Roboto, system-ui, sans-serif; }
    .hpcl-agent__bubble {
        display: inline-flex; align-items: center; gap: 10px; border: none; cursor: pointer;
        background: #0b50a7; color: #fff; padding: 12px 18px 12px 14px; border-radius: 999px;
        box-shadow: 0 12px 30px rgba(11, 80, 167, 0.4); font-weight: 700; font-size: 0.92rem;
        transition: transform 0.15s ease, background 0.15s ease;
    }
    .hpcl-agent__bubble:hover { transform: translateY(-2px); background: #083c80; }
    .hpcl-agent__bubble svg { flex: none; }
    .hpcl-agent__panel {
        position: absolute; right: 0; bottom: 64px; width: 360px; max-width: calc(100vw - 32px);
        height: 520px; max-height: calc(100vh - 110px); display: flex; flex-direction: column;
        background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid rgba(2, 6, 23, 0.1);
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.28);
    }
    .hpcl-agent__head {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        background: linear-gradient(135deg, #0b50a7, #072c5e); color: #fff; padding: 14px 16px;
    }
    .hpcl-agent__title { margin: 0; font-family: Barlow, sans-serif; font-weight: 700; font-size: 1rem; }
    .hpcl-agent__subtitle { margin: 2px 0 0; font-size: 0.72rem; opacity: 0.85; }
    .hpcl-agent__close { background: none; border: none; color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; opacity: 0.85; }
    .hpcl-agent__close:hover { opacity: 1; }
    .hpcl-agent__log { flex: 1; overflow-y: auto; padding: 16px; background: #f6f8fc; display: flex; flex-direction: column; gap: 10px; }
    .hpcl-agent__msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 0.88rem; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .hpcl-agent__msg--bot { align-self: flex-start; background: #fff; color: #1e293b; border: 1px solid rgba(2, 6, 23, 0.08); border-bottom-left-radius: 4px; }
    .hpcl-agent__msg--user { align-self: flex-end; background: #0b50a7; color: #fff; border-bottom-right-radius: 4px; }
    .hpcl-agent__msg--typing { color: #64748b; font-style: italic; }
    .hpcl-agent__cta {
        align-self: flex-start; display: inline-block; margin-top: -2px; padding: 8px 16px; border-radius: 999px;
        background: #ff7a18; color: #fff; text-decoration: none; font-weight: 700; font-size: 0.82rem;
    }
    .hpcl-agent__cta:hover { background: #e8690c; color: #fff; }
    .hpcl-agent__form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid rgba(2, 6, 23, 0.08); background: #fff; }
    .hpcl-agent__input { flex: 1; border: 1px solid rgba(2, 6, 23, 0.16); border-radius: 999px; padding: 10px 14px; font-size: 0.88rem; outline: none; }
    .hpcl-agent__input:focus { border-color: #0b50a7; box-shadow: 0 0 0 3px rgba(11, 80, 167, 0.14); }
    .hpcl-agent__send { flex: none; width: 42px; border: none; border-radius: 50%; background: #0b50a7; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .hpcl-agent__send:hover { background: #083c80; }
    .hpcl-agent__send:disabled { opacity: 0.5; cursor: default; }
    @media (max-width: 480px) {
        #hpcl-agent { right: 12px; bottom: 12px; }
        .hpcl-agent__bubble-label { display: none; }
        .hpcl-agent__panel { bottom: 70px; height: calc(100vh - 100px); }
    }
</style>
<script src="{{BASE}}/assets/js/agent.js?v=1" defer></script>
