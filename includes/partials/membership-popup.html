<!-- Membership sign-up popup: opens 5 seconds after the page has fully loaded (assets/js/membership-popup.js). -->
{!! $membership_popup !!}
<style>
    .mpop { position: fixed; inset: 0; z-index: 1090; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: Roboto, system-ui, sans-serif; }
    .mpop[hidden] { display: none; }
    .mpop__backdrop { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.6); }
    .mpop__dialog { position: relative; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow-y: auto; background: #fff; color: #0f172a; border-radius: 18px; padding: 28px 24px 24px; box-shadow: 0 24px 60px rgba(2, 6, 23, 0.4); animation: mpop-in 0.25s ease-out; }
    .mpop__dialog:focus { outline: none; }
    @keyframes mpop-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .mpop__dialog { animation: none; } }
    .mpop__close { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border: 0; background: none; color: #475569; font-size: 1.9rem; line-height: 1; cursor: pointer; border-radius: 50%; }
    .mpop__close:hover { color: #0b50a7; }
    .mpop h2 { margin: 0 0 4px; padding-right: 36px; color: #0b50a7; font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 2rem; letter-spacing: 0.02em; line-height: 1.05; }
    .mpop__lead { margin: 0 0 14px; color: #475569; font-size: 0.95rem; line-height: 1.5; }
    .mpop__fieldset { margin: 0 0 12px; padding: 0; border: 0; min-width: 0; }
    .mpop__fieldset legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .mpop__tiers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .mpop__tier { margin: 0; cursor: pointer; position: relative; }
    .mpop__tier input { position: absolute; opacity: 0; }
    .mpop__tier-card { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; padding: 8px 6px; border: 2px solid rgba(11, 80, 167, 0.22); border-radius: 12px; text-align: center; transition: border-color 0.15s, background 0.15s; }
    .mpop__tier-name { font-family: "Bebas Neue", sans-serif; font-size: 1.2rem; color: #0b50a7; letter-spacing: 0.02em; line-height: 1.1; }
    .mpop__tier-price { font-weight: 700; font-size: 0.9rem; color: #0f172a; }
    .mpop__tier-price small { font-weight: 500; color: #475569; }
    .mpop__tier input:checked + .mpop__tier-card { border-color: #0b50a7; background: rgba(11, 80, 167, 0.07); }
    .mpop__tier input:focus-visible + .mpop__tier-card { outline: 3px solid #0b50a7; outline-offset: 2px; }
    .mpop__tiers.is-invalid .mpop__tier-card { border-color: #dc3545; }
    .mpop__field { margin: 0 0 12px; min-width: 0; }
    .mpop__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mpop label { display: block; margin: 0 0 4px; font-size: 0.88rem; font-weight: 700; color: #0f172a; }
    .mpop .form-control { min-height: 44px; }
    .mpop__trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .mpop__submit { display: block; width: 100%; min-height: 48px; margin-top: 4px; border: 0; border-radius: 999px; background: #0b50a7; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .mpop__submit:hover { background: #083c80; }
    .mpop__submit:disabled { opacity: 0.65; cursor: default; }
    .mpop__thanks p { color: #475569; line-height: 1.6; margin: 0 0 16px; }
    @media (max-width: 480px) {
        .mpop { align-items: flex-end; padding: 0; }
        .mpop__dialog { max-width: none; max-height: 94vh; border-radius: 18px 18px 0 0; padding: 24px 18px 20px; }
        .mpop__row { grid-template-columns: 1fr; gap: 0; }
    }
</style>
<script src="{{BASE}}/assets/js/membership-popup.js?v=1" defer></script>
